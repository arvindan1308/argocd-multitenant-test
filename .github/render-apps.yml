name: Render customer Applications

on:
  push:
    branches: [main]
    paths:
      - "customers/**/values.yaml"

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        uses: mikefarah/yq@v4.44.3

      - name: Render Application manifests
        run: |
          mkdir -p apps
          for f in customers/*/values.yaml; do
            customer=$(basename "$(dirname "$f")")
            project=$(yq '.argoProject' "$f")
            sed -e "s/__CUSTOMER__/${customer}/g" -e "s/__PROJECT__/${project}/g" \
              ci/app-template.yaml > "apps/${customer}-app.yaml"
          done
      - name: Commit rendered manifests
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@yourorg.com"
          git add apps/
          git diff --cached --quiet || git commit -m "Render customer Applications [ci skip]"
          git push