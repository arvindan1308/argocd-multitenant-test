apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: umbrella
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/arvindan1308/argocd-multitenant-test
    targetRevision: main
    path: helm-chart
    helm:
      valueFiles:
        - values-common.yaml
        - ../customers/umbrella/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: umbrella
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
